# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_language_version = { python = "python3.12" }

default_install_hook_types = ["commit-msg", "pre-commit"]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] }
]

# TODO: worgarside/pre-commit-hooks-dependency-sync only understands
# .pre-commit-config.yaml today, not prek.toml - it will fail here until
# that's fixed upstream. Disabled for now, not removed, as a reminder.
# [[repos]]
# repo = "https://github.com/worgarside/pre-commit-hooks-dependency-sync"
# rev = "1.5.1"
# hooks = [
#   { id = "sync-additional-dependencies", args = ["--package-manager=uv"] }
# ]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.11.31"
hooks = [
  { id = "uv-lock" }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.7"
hooks = [
  { id = "ruff-format" },
  { id = "ruff" }
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "v1.19.1"
hooks = [
  {
    id = "mypy",
    args = [
      "--strict",
      "--show-error-codes"
    ],
    additional_dependencies = [
      "jinja2==3.1.6",
      "jsonpath-ng==1.8.0",
      "pydantic[mypy]==2.12.5",
      "ruamel-yaml==0.18.16",
      "wg-utilities==5.17.4",
      "pytest==8.4.1",
      "httpx==0.28.1",
      "pytest-codspeed==2.2.1"
    ]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  {
    id = "check-added-large-files",
    args = ["--maxkb=1000"]
  },
  { id = "check-case-conflict" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  {
    id = "name-tests-test",
    args = ["--pytest-test-first"]
  },
  {
    id = "pretty-format-json",
    args = [
      "--no-sort-keys",
      "--autofix",
      "--indent",
      "2"
    ]
  },
  { id = "requirements-txt-fixer" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/jumanjihouse/pre-commit-hook-yamlfmt"
rev = "0.2.3"
hooks = [
  {
    id = "yamlfmt",
    args = [
      "--mapping",
      "2",
      "--sequence",
      "4",
      "--offset",
      "2",
      "--width",
      "4096"
    ]
  }
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint.git"
rev = "v1.38.0"
hooks = [
  {
    id = "yamllint",
    args = [
      "--format",
      "parsable",
      "--strict"
    ]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pygrep-hooks"
rev = "v1.10.0"
hooks = [
  { id = "python-check-blanket-noqa" },
  { id = "python-check-blanket-type-ignore" },
  { id = "python-check-mock-methods" }
]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.2"
hooks = [
  {
    id = "codespell",
    additional_dependencies = ["tomli"],
    args = [
      "--skip",
      "*.svg,*.json"
    ]
  }
]

[[repos]]
repo = "https://github.com/jendrikseipp/vulture"
rev = "v2.15"
hooks = [
  { id = "vulture" }
]
