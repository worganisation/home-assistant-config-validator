---
name: CodSpeed Benchmarks

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run Benchmarks
    # 
    permissions:
      contents: read
      id-token: write
    # 
    env:
      BENCHMARK_REPO: 'worganisation/home-assistant'
      HA_BENCHMARK_REPO_PATH: '${{ github.workspace }}/benchmark-input'
    runs-on: ubuntu-24.04
    if: >-
      github.repository != 'worganisation/home-assistant-config-validator' &&
      !github.event.pull_request.draft
    steps:
      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get benchmark fixture release
        if: env.BENCHMARK_REPO != ''
        id: fixture-tag
        env:
          GH_TOKEN: '${{ secrets.WORGARSIDE_DEV_TOKEN }}'
        run: |
          tag=$(gh release view --repo "$BENCHMARK_REPO" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout benchmark fixture
        if: env.BENCHMARK_REPO != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: '${{ env.BENCHMARK_REPO }}'
          ref: '${{ steps.fixture-tag.outputs.tag }}'
          path: benchmark-input
          token: '${{ secrets.WORGARSIDE_DEV_TOKEN }}'
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: "${{ runner.environment == 'github-hosted' }}"
          cache-local-path: '${{ runner.tool_cache }}/uv-cache'
          python-version: '3.12'

      - name: Install Dependencies
        run: uv sync --locked --all-groups

      - name: Run Benchmarks
        uses: CodSpeedHQ/action@b1f28b5eccf7cb5bfe6a2a89cb3053eb67f1150c # v5.8.0
        with:
          mode: simulation
          token: ''
          run: uv run --no-sync pytest tests/benchmark --codspeed -v -n 0
