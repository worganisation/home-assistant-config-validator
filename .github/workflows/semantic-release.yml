---
name: Semantic Release

on:
  push:
    branches:
      - main
    paths:
      - home_assistant_config_validator/**
      - '!home_assistant_config_validator/__init__.py'

  workflow_dispatch:
    inputs:
      force-deployment:
        description: Force a release at a specific level, bypassing normal detection
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  release:
    name: Release
    uses: worgarside/github-config-files/.github/workflows/__semantic-release.yml@main
    with:
      python-version: '3.12'
      force-deployment: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}
    secrets: inherit
